# Cấu hình cho Market Data Service
app:
  name: "market-data-service"
  version: "1.0.0"
  environment: "development" # development, staging, production

# Cấu hình HTTP server
http:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 5s

# Cấu hình gRPC server
grpc:
  host: "0.0.0.0"
  port: 9090
  max_concurrent_streams: 1000
  connection_timeout: 10s
  max_connection_idle: 60s
  max_connection_age: 300s

# Cấu hình logging
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, console
  output: "stdout" # stdout, file
  file_path: "logs/marketdata.log" # chỉ dùng khi output là file

# Cấu hình database
database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  username: "postgres"
  password: "postgres"
  database: "marketdata"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 25
  conn_max_lifetime: 5m

# Cấu hình Redis
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  idle_timeout: 300s
  max_retries: 3
  min_retry_backoff: 8ms
  max_retry_backoff: 512ms

# Cấu hình Kafka
kafka:
  bootstrap_servers: "localhost:9092"
  client_id: "market-data-service"
  consumer_group: "market-data-service-group"
  auto_offset_reset: "earliest" # earliest, latest
  enable_auto_commit: true
  auto_commit_interval: 5s
  session_timeout: 30s
  heartbeat_interval: 10s
  max_poll_records: 500
  topics:
    price_updated: "market-data.price-updated"
    new_trade: "market-data.new-trade"
    alert_triggered: "market-data.alert-triggered"
    default: "market-data.events"

# Cấu hình Binance
binance:
  spot:
    base_url: "https://api.binance.com"
    ws_url: "wss://stream.binance.com:9443/ws"
    api_key: "${BINANCE_SPOT_API_KEY}"
    secret_key: "${BINANCE_SPOT_SECRET_KEY}"
    symbols:
      - "BTCUSDT"
      - "ETHUSDT"
      - "BNBUSDT"
      - "ADAUSDT"
      - "DOGEUSDT"
    timeframes:
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "1d"
    rate_limit:
      requests_per_minute: 1200
      orders_per_second: 10
      orders_per_day: 100000
  futures:
    base_url: "https://fapi.binance.com"
    ws_url: "wss://fstream.binance.com/ws"
    api_key: "${BINANCE_FUTURES_API_KEY}"
    secret_key: "${BINANCE_FUTURES_SECRET_KEY}"
    symbols:
      - "BTCUSDT"
      - "ETHUSDT"
      - "BNBUSDT"
      - "ADAUSDT"
      - "DOGEUSDT"
    timeframes:
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "1d"
    rate_limit:
      requests_per_minute: 2400
      orders_per_second: 50
      orders_per_day: 200000

# Cấu hình XTB
xtb:
  base_url: "wss://ws.xtb.com"
  api_key: "${XTB_API_KEY}"
  password: "${XTB_PASSWORD}"
  symbols:
    - "BITCOIN"
    - "ETHEREUM"
    - "US500"
    - "GOLD"
    - "EURUSD"
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  rate_limit:
    requests_per_minute: 300

# Cấu hình cho các endpoint
endpoints:
  ticker:
    path: "/api/v1/tickers/{exchange}/{symbol}"
    method: "GET"
    rate_limit: 100 # requests per minute
    cache_ttl: 5s
  tickers:
    path: "/api/v1/tickers/{exchange}"
    method: "GET"
    rate_limit: 50 # requests per minute
    cache_ttl: 5s
  candles:
    path: "/api/v1/candles/{exchange}/{symbol}/{timeframe}"
    method: "GET"
    rate_limit: 50 # requests per minute
    cache_ttl: 30s
  trades:
    path: "/api/v1/trades/{exchange}/{symbol}"
    method: "GET"
    rate_limit: 50 # requests per minute
    cache_ttl: 5s
  order_book:
    path: "/api/v1/orderbook/{exchange}/{symbol}"
    method: "GET"
    rate_limit: 50 # requests per minute
    cache_ttl: 1s
