version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: trading_db
    ports:
      - "5434:5432"  # mapped to 5434 to avoid host PostgreSQL conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - platform

volumes:
  postgres_data:

networks:
  platform:
    driver: bridge
